@defer(on idle) {
<app-new></app-new>
} @placeholder(minimum 5s) {
<p>Mostrar antes de carregar algo.</p>
} @loading() {
<p>Loading... qaundo o component esta sendo carregado</p>
} @error {
<p>Loading failed.</p>
<p>Internet caiu</p>
}

<button (click)="isTrue = true">Exibir</button>
@defer(when loadingData$ | async) {
<p>Data carregada</p>
}
